projects:
  - title: kroshtan.com
    description: >-
      This website. Its "Can I help with this?" box streams an honest fit assessment from
      Claude, grounded in the site's own content, with per-visitor rate limits and a daily
      cost cap. Every push is linted, tested and built into a container image on GitHub
      Actions, then deployed to Render through a deploy hook.
    url: https://github.com/kroshtan/kroshtan-web
    tags: [python, fastapi, llm, claude-api, ci/cd, docker]
  - title: Veridex
    description: >-
      A prototype backend that scores e-commerce product pages for scam and dropshipping
      signals. A LangGraph pipeline classifies the page, fans out to independent checks
      (listing copy, dropship-app fingerprints, review integrity, claim plausibility, domain
      age, image EXIF and reverse image search) in parallel, and has an LLM judge condense
      their evidence into a 0–100 reliability score. Accounts, daily quotas and Paddle
      billing show how it would run as a real service.
    url: https://github.com/kroshtan/veridex_backend
    tags: [python, fastapi, langgraph, llm, agents, postgres]

