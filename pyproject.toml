[project]
name = "kroshtan-web"
description = "kroshtan.com — the website of Kroshtan, independent ML/AI engineering"
version = "0.1.0"
authors = [
    { name = "Floris van Beers" },
]
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"

dependencies = [
    "fastapi~=0.136",
    "jinja2~=3.1",
    "markdown~=3.8",
    "pyyaml~=6.0",
    "uvicorn~=0.46",
]

[dependency-groups]
dev = [
    "uv>=0.11.11",
    "httpx2",
    "mypy>=2.0.0",
    "pre-commit>=4.6.0",
    "pydoclint>=0.8.3",
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.15.12",
    "types-Markdown",
    "types-PyYAML",
    "watchfiles>=1.0",
]

[tool.uv]
# Not an installable package: the app runs from the repo root as `app.main:app`.
package = false

[tool.ruff]
line-length = 119

[tool.ruff.lint]
select = [
    "ANN",
    "B",
    "C4",
    "C90",
    "D",
    "E",
    "F",
    "G",
    "I",
    "ISC",
    "N",
    "PERF",
    "PL",
    "FURB",
    "SIM",
    "T20",
    "TD",
    "TID252",
    "UP",
]

ignore = [
    "ANN002", "ANN003", "ANN401",
    "D100", "D101", "D104", "D106", "D107", "D202", "D203", "D212", "D301", "D401", "D413",
    "G004",
    "ISC001",
    "TD002", "TD003",
    "PLR0913", "PLR2004"
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401", "F403"]
"tests/**" = ["D103", "PLR2004"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = [
    "fastapi.Header",
    "fastapi.Depends",
    "fastapi.Query",
]

[tool.mypy]
exclude = [".git", ".venv"]
ignore_missing_imports = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
warn_return_any = true
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true
strict_equality = true

[tool.pydoclint]
style = "sphinx"
allow-init-docstring = true
require-return-section-when-returning-nothing = false
check-return-types = false
check-yield-types = false
check-style-mismatch = true
arg-type-hints-in-docstring = false
should-document-star-arguments = false
skip-checking-short-docstrings = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = [
    "--cov=app",
    "--strict-markers",
    "--cov-report=term",
    "--cov-report=xml",
]

[tool.coverage.report]
skip_covered = true
exclude_also = [
    "if __name__ == .__main__.:",
]
